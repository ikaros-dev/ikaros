openapi: 3.1.0
info:
  title: Ikaros V2 P0 API
  version: 0.1.0
  description: |
    Machine-readable P0 HTTP contract for Ikaros V2.
    Business semantics are owned by docs/v2/contracts/P0-Command-Query-Event-Catalog.md.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Resources
  - name: Search
  - name: Attachments
  - name: Background Tasks
  - name: Operations Diagnostics
  - name: Media
  - name: Admin Storage
  - name: Admin Identity
paths:
  /attachments/{attachment_id}/availability:
    get:
      operationId: getAttachmentMediaAvailability
      summary: Get media availability for an attachment
      tags: [Media]
      parameters:
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
        - in: path
          name: attachment_id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Attachment media availability
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaAvailabilityResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachments/{attachment_id}/restore-requests:
    post:
      tags: [Attachments]
      operationId: requestAttachmentRestore
      x-ikaros-contract-id: storage.request-attachment-restore
      summary: Request asynchronous restoration of an archived attachment
      parameters:
        - $ref: '#/components/parameters/AttachmentId'
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                provider_restore_class: { type: [string, 'null'] }
                budget_confirmation_token: { type: [string, 'null'], writeOnly: true }
      responses:
        '202':
          description: Restore request accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RestoreRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }

  /media/resources/{resource_id}/playback-source:
    get:
      tags: [Media]
      operationId: resolvePlaybackSource
      x-ikaros-contract-id: media.resolve-playback-source
      summary: Resolve an authorized playable source
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: release_id
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Playable source
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSource' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/playback/resources/{resource_id}/sessions:
    post:
      tags: [Media]
      operationId: startPlaybackSession
      x-ikaros-contract-id: media.start-playback-session
      summary: Start a playback session
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StartPlaybackRequest' }
      responses:
        '200':
          description: Active playback session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/playback/sessions/{session_id}:
    patch:
      tags: [Media]
      operationId: updatePlaybackProgress
      x-ikaros-contract-id: media.update-playback-progress
      summary: Save playback progress
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdatePlaybackProgressRequest' }
      responses:
        '200':
          description: Updated playback session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaybackSession' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /media/playback/resources/{resource_id}/progress:
    get:
      tags: [Media]
      operationId: getPlaybackProgress
      x-ikaros-contract-id: media.get-playback-progress
      summary: Get saved playback progress
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - in: header
          name: X-Ikaros-Actor-Id
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Saved playback progress
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResourceProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /media/subjects:
    get:
      tags: [Media]
      operationId: listMediaSubjects
      x-ikaros-contract-id: media.list-subjects
      summary: List owned video subjects
      parameters:
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Video subjects
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MediaSubject' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Media]
      operationId: createMediaSubject
      x-ikaros-contract-id: media.create-subject
      summary: Create a video subject and its Resource
      parameters:
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, kind]
              properties:
                title: { type: string, minLength: 1, maxLength: 512 }
                kind: { type: string, enum: [SERIES, MOVIE, VIDEO] }
                locale: { type: string, minLength: 1, maxLength: 32, default: en-US }
      responses:
        '200':
          description: Created video subject
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSubject' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /health/operations:
    get:
      tags: [Operations Diagnostics]
      operationId: getOperationsDiagnostics
      x-ikaros-contract-id: operations.get-diagnostics
      summary: View background task and durable event delivery diagnostics
      responses:
        '200':
          description: Operations diagnostics
          content:
            application/json:
              schema:
                type: object
                required: [pending_tasks, running_tasks, failed_tasks, timed_out_tasks, event_delivery]
                properties:
                  pending_tasks: { type: integer, format: int64, minimum: 0 }
                  running_tasks: { type: integer, format: int64, minimum: 0 }
                  failed_tasks: { type: integer, format: int64, minimum: 0 }
                  timed_out_tasks: { type: integer, format: int64, minimum: 0 }
                  event_delivery:
                    type: object
                    required: [pending_count, attempted_pending_count]
                    properties:
                      pending_count: { type: integer, format: int64, minimum: 0 }
                      attempted_pending_count: { type: integer, format: int64, minimum: 0 }
                      last_attempt_at: { type: [string, 'null'], format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /media/subjects/{subject_id}/seasons/{season_id}/actions/reorder-episodes:
    post:
      tags: [Media]
      operationId: reorderMediaEpisodes
      x-ikaros-contract-id: media.reorder-episodes
      summary: Reorder all episodes in a season
      parameters:
        - name: subject_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: season_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [episode_ids]
              properties:
                episode_ids:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items: { type: string, format: uuid }
      responses:
        '200': { description: Episode order saved }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/resources/{resource_id}/releases:
    get:
      tags: [Media]
      operationId: listMediaReleases
      x-ikaros-contract-id: media.list-releases
      summary: List playback releases for a video Resource
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Playback releases
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MediaRelease' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Media]
      operationId: addMediaRelease
      x-ikaros-contract-id: media.add-release
      summary: Associate an active Attachment as a playback release
      parameters:
        - name: resource_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachment_id]
              properties:
                attachment_id: { type: string, format: uuid }
                release_group: { type: [string, 'null'] }
                version_label: { type: [string, 'null'] }
                content_fingerprint: { type: [string, 'null'] }
      responses:
        '200':
          description: Playback release created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaRelease' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /media/releases/{release_id}/subtitles:
    get:
      tags: [Media]
      operationId: listMediaSubtitles
      x-ikaros-contract-id: media.list-subtitles
      summary: List subtitles for a playback release
      parameters:
        - name: release_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: External subtitles
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/MediaSubtitle' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Media]
      operationId: addMediaSubtitle
      x-ikaros-contract-id: media.add-subtitle
      summary: Associate an active subtitle Attachment with a release
      parameters:
        - name: release_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [attachment_id, language, format]
              properties:
                attachment_id: { type: string, format: uuid }
                language: { type: string, minLength: 1 }
                title: { type: [string, 'null'] }
                format: { type: string, minLength: 1 }
                provider: { type: [string, 'null'] }
                offset_millis: { type: integer, format: int64 }
                forced: { type: boolean }
                hearing_impaired: { type: boolean }
      responses:
        '200':
          description: Subtitle association created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MediaSubtitle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /search:
    get:
      tags: [Search]
      operationId: searchResources
      x-ikaros-contract-id: search.keyword-search
      summary: Search visible resources by keyword
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 200 }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { type: string, maxLength: 64 }
        - name: tag
          in: query
          schema: { type: string, maxLength: 128 }
      responses:
        '200':
          description: Search result page
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /resources:
    get:
      tags: [Resources]
      operationId: listResources
      x-ikaros-contract-id: resource.list-resources
      summary: List visible resources
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
        - name: type
          in: query
          schema: { type: string }
        - name: lifecycle_status
          in: query
          schema:
            $ref: '#/components/schemas/ResourceLifecycleStatus'
      responses:
        '200':
          description: Resource page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourcePage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Resources]
      operationId: createResource
      x-ikaros-contract-id: resource.create-resource
      summary: Create a resource
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateResourceRequest'
      responses:
        '201':
          description: Resource created
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /resources/{resource_id}:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    get:
      tags: [Resources]
      operationId: getResource
      x-ikaros-contract-id: resource.get-resource
      summary: Get a resource
      responses:
        '200':
          description: Resource
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Resources]
      operationId: updateResource
      x-ikaros-contract-id: resource.update-resource
      summary: Update directly editable resource fields
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/UpdateResourceRequest'
      responses:
        '200':
          description: Updated resource
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /resources/{resource_id}/actions/archive:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Resources]
      operationId: archiveResource
      x-ikaros-contract-id: resource.archive-resource
      summary: Archive a resource
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Archived resource
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /resources/{resource_id}/actions/restore:
    parameters:
      - $ref: '#/components/parameters/ResourceId'
    post:
      tags: [Resources]
      operationId: restoreResource
      x-ikaros-contract-id: resource.restore-resource
      summary: Restore an archived or trashed resource
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Restored resource
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resource'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
        '428': { $ref: '#/components/responses/PreconditionRequired' }
  /attachments/{attachment_id}:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachment
      x-ikaros-contract-id: storage.get-attachment
      summary: Get attachment metadata
      responses:
        '200':
          description: Attachment metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /attachments/{attachment_id}/content:
    parameters:
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Attachments]
      operationId: getAttachmentContent
      x-ikaros-contract-id: storage.get-attachment-content
      summary: Stream attachment content
      parameters:
        - name: Range
          in: header
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Full content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          description: Partial content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '503':
          description: Blob temporarily unavailable
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /background-tasks:
    post:
      tags: [Background Tasks]
      operationId: submitBackgroundTask
      x-ikaros-contract-id: operations.submit-background-task
      summary: Submit a durable background task
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitBackgroundTaskRequest'
      responses:
        '202':
          description: Background task accepted after durable persistence
          headers:
            Location:
              schema: { type: string, format: uri }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackgroundTask' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /background-tasks/{task_id}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Background Tasks]
      operationId: getBackgroundTask
      x-ikaros-contract-id: operations.get-background-task
      summary: Get background task state
      responses:
        '200':
          description: Background task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundTask'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /background-tasks/{task_id}/actions/cancel:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Background Tasks]
      operationId: cancelBackgroundTask
      x-ikaros-contract-id: operations.cancel-background-task
      summary: Request cancellation of a background task
      responses:
        '200':
          description: Task after cancellation request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackgroundTask'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /background-tasks/{task_id}/actions/retry:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    post:
      tags: [Background Tasks]
      operationId: retryBackgroundTask
      x-ikaros-contract-id: operations.retry-background-task
      summary: Retry a failed background task
      responses:
        '200':
          description: New pending task created from the failed task
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackgroundTask' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/storage-providers:
    get:
      tags: [Admin Storage]
      operationId: listStorageProviders
      x-ikaros-contract-id: storage.list-providers
      summary: List configured storage providers
      responses:
        '200':
          description: Storage providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StorageProvider'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Storage]
      operationId: createStorageProvider
      x-ikaros-contract-id: storage.create-provider
      summary: Create a storage provider
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStorageProviderRequest'
      responses:
        '201':
          description: Storage provider created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StorageProvider'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/storage-providers/{provider_id}/probe:
    post:
      tags: [Admin Storage]
      operationId: probeStorageProvider
      x-ikaros-contract-id: storage.probe-provider
      summary: Probe storage provider connection and read/write capability
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Probe result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageProviderProbeResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/storage-providers/{provider_id}/credentials:
    post:
      tags: [Admin Storage]
      operationId: replaceStorageProviderCredentials
      x-ikaros-contract-id: storage.replace-provider-credentials
      summary: Replace provider credentials and verify access
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [access_key_id, secret_access_key]
              properties:
                access_key_id: { type: string, minLength: 1, maxLength: 256, writeOnly: true }
                secret_access_key: { type: string, minLength: 1, maxLength: 512, writeOnly: true }
                session_token: { type: [string, 'null'], maxLength: 2048, writeOnly: true }
      responses:
        '200':
          description: Credential verification result; raw credentials are never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StorageProviderProbeResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/storage-providers/{provider_id}/status:
    get:
      tags: [Admin Storage]
      operationId: getStorageProviderStatus
      x-ikaros-contract-id: storage.get-provider-status
      summary: View storage provider health and optional capacity
      parameters:
        - name: provider_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Provider status
          content:
            application/json:
              schema:
                type: object
                required: [provider_id, provider_status, health, checked_at]
                properties:
                  provider_id: { type: string, format: uuid }
                  provider_status: { type: string }
                  health: { $ref: '#/components/schemas/StorageProviderProbeResult' }
                  capacity_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
                  used_bytes: { type: [integer, 'null'], format: int64, minimum: 0 }
                  checked_at: { type: string, format: date-time }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/users:
    get:
      tags: [Admin Identity]
      operationId: listUsers
      x-ikaros-contract-id: identity.list-users
      summary: List users
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: User page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Admin Identity]
      operationId: createUser
      x-ikaros-contract-id: identity.create-user
      summary: Create a user
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/roles:
    get:
      tags: [Admin Identity]
      operationId: listRoles
      x-ikaros-contract-id: identity.list-roles
      summary: List roles
      responses:
        '200':
          description: Roles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/permissions:
    get:
      tags: [Admin Identity]
      operationId: listPermissions
      x-ikaros-contract-id: identity.list-permissions
      summary: List registered backend permissions
      responses:
        '200':
          description: Permissions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /reading/comic-imports:
    post:
      tags: [Reading]
      operationId: createComicImport
      x-ikaros-contract-id: reading.create-comic-import
      summary: Register a supported comic package for import
      parameters:
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateComicImportRequest' }
      responses:
        '200':
          description: Comic package accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComicImport' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Reading]
      operationId: listComicImports
      x-ikaros-contract-id: reading.list-comic-imports
      summary: List comic package imports
      parameters:
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comic package imports
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/ComicImport' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /reading/comic-imports/{import_id}:
    get:
      tags: [Reading]
      operationId: getComicImport
      x-ikaros-contract-id: reading.get-comic-import
      summary: Get one comic package import
      parameters:
        - name: import_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: X-Ikaros-Actor-Id
          in: header
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Comic package import
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComicImport' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque-or-jwt
  parameters:
    Cursor:
      name: cursor
      in: query
      required: false
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    ResourceId:
      name: resource_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AttachmentId:
      name: attachment_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: task_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authorization denied
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Resource not found or not visible
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Conflict:
      description: Business or idempotency conflict
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionFailed:
      description: ETag/version precondition failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    PreconditionRequired:
      description: If-Match is required
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        request_id: { type: string }
        trace_id: { type: string }
        errors:
          type: array
          items:
            type: object
            additionalProperties: true
    ResourceLifecycleStatus:
      type: string
      enum: [ACTIVE, ARCHIVED, TRASHED, PURGED]
    DataClassification:
      type: string
      enum: [PUBLIC, SHARED, PRIVATE, SENSITIVE, SECURE]
    Resource:
      type: object
      required: [id, type, lifecycle_status, data_classification, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        type: { type: string }
        primary_title: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        lifecycle_status: { $ref: '#/components/schemas/ResourceLifecycleStatus' }
        data_classification: { $ref: '#/components/schemas/DataClassification' }
        version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateResourceRequest:
      type: object
      required: [type, data_classification]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, minLength: 1 }
        primary_title: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        data_classification: { $ref: '#/components/schemas/DataClassification' }
        titles:
          type: array
          items:
            type: object
            required: [text, role, source_kind]
            properties:
              text: { type: string }
              language_tag: { type: [string, 'null'] }
              role: { type: string }
              source_kind: { type: string }
              pinned: { type: boolean, default: false }
              priority: { type: integer, default: 0 }
    UpdateResourceRequest:
      type: object
      properties:
        primary_title: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        data_classification: { $ref: '#/components/schemas/DataClassification' }
      additionalProperties: false
    ResourcePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Resource' }
        next_cursor: { type: [string, 'null'] }
    SearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [resource_id, source_version, fields]
            properties:
              resource_id: { type: string, format: uuid }
              source_version: { type: integer, format: int64, minimum: 0 }
              fields: { type: object, additionalProperties: true }
        next_cursor: { type: [string, 'null'] }
    Attachment:
      type: object
      required: [id, blob_id, data_classification, lifecycle_status, version, created_at]
      properties:
        id: { type: string, format: uuid }
        blob_id: { type: string, format: uuid }
        filename: { type: [string, 'null'] }
        media_type: { type: [string, 'null'] }
        usage_kind: { type: [string, 'null'] }
        data_classification: { $ref: '#/components/schemas/DataClassification' }
        lifecycle_status:
          type: string
          enum: [ACTIVE, ARCHIVED, TRASHED, PURGED]
        version: { type: integer, format: int64, minimum: 0 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaSubject:
      type: object
      required: [id, resource_id, kind, created_at]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        kind: { type: string, enum: [SERIES, MOVIE, VIDEO] }
        created_at: { type: string, format: date-time }
    MediaRelease:
      type: object
      required: [id, playable_resource_id, attachment_id, state, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        playable_resource_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        release_group: { type: [string, 'null'] }
        version_label: { type: [string, 'null'] }
        state: { type: string, enum: [AVAILABLE, MISSING, CORRUPTED, ARCHIVED] }
        content_fingerprint: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    MediaAvailabilityResponse:
      type: object
      required: [attachment_id, availability]
      properties:
        attachment_id: { type: string, format: uuid }
        availability:
          type: string
          enum: [READY, RESTORE_REQUIRED, RESTORING, READY_TEMPORARILY, UNAVAILABLE, MISSING, CORRUPTED]
        restore_request_id: { type: [string, 'null'], format: uuid }
        restore_latency_min_seconds: { type: [integer, 'null'], minimum: 0 }
        restore_latency_max_seconds: { type: [integer, 'null'], minimum: 0 }
        temporary_copy_expires_at: { type: [string, 'null'], format: date-time }
    PlaybackSource:
      type: object
      required: [release_id, attachment_id, mode, reason, content_url]
      properties:
        release_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        mode: { type: string, enum: [DIRECT_PLAY, RESTORE_THEN_PLAY] }
        reason: { type: string }
        content_url: { type: string }
    StartPlaybackRequest:
      type: object
      required: [release_id, start_position_seconds]
      properties:
        release_id: { type: string, format: uuid }
        start_position_seconds: { type: integer, format: int64, minimum: 0 }
    UpdatePlaybackProgressRequest:
      type: object
      required: [position_seconds, completed]
      properties:
        position_seconds: { type: integer, format: int64, minimum: 0 }
        total_seconds: { type: [integer, 'null'], format: int64, minimum: 0 }
        completed: { type: boolean }
    ResourceProgress:
      type: object
      required: [id, resource_id, type, position, completed]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        type: { type: string, enum: [VIDEO_SECONDS, AUDIO_SECONDS, READING_PAGES, READING_PERCENT] }
        position: { type: integer, format: int64, minimum: 0 }
        total: { type: [integer, 'null'], format: int64, minimum: 0 }
        completed: { type: boolean }
        updated_at: { type: [string, 'null'], format: date-time }
        version: { type: [integer, 'null'], format: int64, minimum: 0 }
    RestoreRequest:
      type: object
      required: [id, scope_type, scope_id, status, item_count, total_bytes, ready_items, failed_items, created_at]
      properties:
        id: { type: string, format: uuid }
        scope_type: { type: string, enum: [ATTACHMENT, SEASON] }
        scope_id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, ACTIVE, SUCCEEDED, PARTIAL, FAILED, CANCELLED] }
        item_count: { type: integer, minimum: 0 }
        total_bytes: { type: integer, format: int64, minimum: 0 }
        ready_items: { type: integer, minimum: 0 }
        failed_items: { type: integer, minimum: 0 }
        budget_decision: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    PlaybackSession:
      type: object
      required: [id, resource_id, release_id, state, started_at, last_position_seconds]
      properties:
        id: { type: string, format: uuid }
        resource_id: { type: string, format: uuid }
        release_id: { type: string, format: uuid }
        state: { type: string, enum: [ACTIVE, ENDED] }
        started_at: { type: string, format: date-time }
        ended_at: { type: [string, 'null'], format: date-time }
        last_position_seconds: { type: integer, format: int64, minimum: 0 }
        version: { type: [integer, 'null'], format: int64, minimum: 0 }
    MediaSubtitle:
      type: object
      required: [id, release_id, attachment_id, language, format, offset_millis, forced, hearing_impaired]
      properties:
        id: { type: string, format: uuid }
        release_id: { type: string, format: uuid }
        attachment_id: { type: string, format: uuid }
        language: { type: string }
        title: { type: [string, 'null'] }
        format: { type: string }
        provider: { type: [string, 'null'] }
        offset_millis: { type: integer, format: int64 }
        forced: { type: boolean }
        hearing_impaired: { type: boolean }
    CreateComicImportRequest:
      type: object
      required: [attachment_id]
      additionalProperties: false
      properties:
        attachment_id: { type: string, format: uuid }
        title: { type: [string, 'null'] }
        language: { type: [string, 'null'] }
    ComicImport:
      type: object
      required: [id, source_attachment_id, work_id, edition_id, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_attachment_id: { type: string, format: uuid }
        work_id: { type: string, format: uuid }
        edition_id: { type: string, format: uuid }
        status: { type: string, enum: [ACCEPTED, PARSING, SUCCEEDED, FAILED] }
        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    BackgroundTask:
      type: object
      required: [id, task_type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_type: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
        cancellable: { type: boolean }
        progress:
          type: [object, 'null']
          additionalProperties: true
        result_summary:
          type: [object, 'null']
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    SubmitBackgroundTaskRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, minLength: 1 }
        payload:
          type: object
          additionalProperties: true
    StorageProvider:
      type: object
      required: [id, provider_key, provider_type, display_name, tier, enabled, drain_status, version]
      properties:
        id: { type: string, format: uuid }
        provider_key: { type: string }
        provider_type: { type: string }
        display_name: { type: string }
        tier:
          type: string
          enum: [HOT, WARM, COLD, ARCHIVE]
        enabled: { type: boolean }
        drain_status:
          type: string
          enum: [NORMAL, DRAINING, DRAINED]
        capabilities:
          type: object
          additionalProperties: true
        version: { type: integer, format: int64 }
    StorageProviderProbeResult:
      type: object
      required: [provider_id, status, connection, read, write, checked_at]
      properties:
        provider_id: { type: string, format: uuid }
        status: { type: string, enum: [HEALTHY, DEGRADED, FAILED, UNSUPPORTED] }
        connection: { type: boolean }
        read: { type: boolean }
        write: { type: boolean }
        checked_at: { type: string, format: date-time }
        error_code: { type: [string, 'null'] }
    CreateStorageProviderRequest:
      type: object
      required: [provider_key, provider_type, display_name, tier, capabilities]
      properties:
        provider_key: { type: string, minLength: 1 }
        provider_type: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        credential_ref:
          type: [string, 'null']
          description: Secret reference only; plaintext credentials are forbidden.
        tier:
          type: string
          enum: [HOT, WARM, COLD, ARCHIVE]
        capabilities:
          type: object
          additionalProperties: true
    User:
      type: object
      required: [id, username, status, security_version, version, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: [string, 'null'] }
        status:
          type: string
          enum: [ACTIVE, DISABLED, LOCKED, DELETED]
        security_version: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        next_cursor: { type: [string, 'null'] }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1 }
        email: { type: [string, 'null'], format: email }
        display_name: { type: [string, 'null'] }
        initial_password:
          type: [string, 'null']
          writeOnly: true
          description: Accepted only over authenticated TLS; never persisted or logged in plaintext.
    Role:
      type: object
      required: [id, role_key, display_name, system_role, version]
      properties:
        id: { type: string, format: uuid }
        role_key: { type: string }
        display_name: { type: string }
        system_role: { type: boolean }
        version: { type: integer, format: int64 }
    Permission:
      type: object
      required: [permission_key, owner_subsystem, description, risk_level, minimum_svl, fresh_verification_required, deprecated]
      properties:
        permission_key: { type: string }
        owner_subsystem: { type: string }
        description: { type: string }
        risk_level:
          type: string
          enum: [LOW, MEDIUM, HIGH, CRITICAL]
        minimum_svl: { type: integer, minimum: 0 }
        fresh_verification_required: { type: boolean }
        deprecated: { type: boolean }

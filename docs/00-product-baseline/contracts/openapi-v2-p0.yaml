        error_code: { type: [string, 'null'] }
        error_message: { type: [string, 'null'] }
    EbookChapterContent:
      type: object
      required: [chapter_id, title, href, content]
      properties:
        chapter_id: { type: string, format: uuid }
        title: { type: string }
        href: { type: string }
        content: { type: string }
    ReadingBookmarkRequest:
      type: object
      required: [locator_kind, locator_value]
      properties:
        locator_kind: { type: string, minLength: 1, maxLength: 32 }
        locator_value: { type: string, minLength: 1, maxLength: 1024 }
        content_version: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
    ReadingBookmark:
      type: object
      required: [id, work_id, edition_id, chapter_id, locator_kind, locator_value, created_at]
      properties:
        id: { type: string, format: uuid }
        work_id: { type: string, format: uuid }
        edition_id: { type: string, format: uuid }
        chapter_id: { type: string, format: uuid }
        locator_kind: { type: string }
        locator_value: { type: string }
        content_version: { type: [string, 'null'] }
        label: { type: [string, 'null'] }
        created_at: { type: string, format: date-time }
    ReorderComicPagesRequest:
      type: object
      required: [chapter_key, entry_ids]
      additionalProperties: false
      properties:
        chapter_key: { type: string, minLength: 1 }
        entry_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items: { type: string, format: uuid }
    BackgroundTask:
      type: object
      required: [id, task_type, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        task_type: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, SUCCEEDED, FAILED, CANCELLED, TIMED_OUT]
        cancellable: { type: boolean }
        progress:
          type: [object, 'null']
          additionalProperties: true
        result_summary:
          type: [object, 'null']
          additionalProperties: true
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
    DurableEvent:
      type: object
      required: [id, event_type, schema_version, producer_subsystem, subject_type, payload_json, occurred_at]
      properties:
        id: { type: string, format: uuid }
        event_type: { type: string }
        schema_version: { type: integer, minimum: 1 }
        producer_subsystem: { type: string }
        subject_type: { type: string }
        subject_id: { type: [string, 'null'], format: uuid }
        payload_json: { type: string }
        occurred_at: { type: string, format: date-time }
        request_id: { type: [string, 'null'] }
        correlation_id: { type: [string, 'null'] }
        causation_id: { type: [string, 'null'] }
        actor_id: { type: [string, 'null'], format: uuid }
    DurableEventRetryResult:
      type: object
      required: [event_id, dispatched_count]
      properties:
        event_id: { type: string, format: uuid }
        dispatched_count: { type: integer, format: int64, minimum: 0 }
    SubmitBackgroundTaskRequest:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        type: { type: string, minLength: 1 }
        payload:
          type: object
          additionalProperties: true
    StorageProvider:
      type: object
      required: [id, provider_key, provider_type, display_name, tier, enabled, drain_status, version]
      properties:
        id: { type: string, format: uuid }
        provider_key: { type: string }
        provider_type: { type: string }
        display_name: { type: string }
        tier:
          type: string
          enum: [HOT, WARM, COLD, ARCHIVE]
        enabled: { type: boolean }
        drain_status:
          type: string
          enum: [NORMAL, DRAINING, DRAINED]
        capabilities:
          type: object
          additionalProperties: true
        version: { type: integer, format: int64 }
    StorageProviderProbeResult:
      type: object
      required: [provider_id, status, connection, read, write, checked_at]
      properties:
        provider_id: { type: string, format: uuid }
        status: { type: string, enum: [HEALTHY, DEGRADED, FAILED, UNSUPPORTED] }
        connection: { type: boolean }
        read: { type: boolean }
        write: { type: boolean }
        checked_at: { type: string, format: date-time }
        error_code: { type: [string, 'null'] }
    CreateStorageProviderRequest:
      type: object
      required: [provider_key, provider_type, display_name, tier, capabilities]
      properties:
        provider_key: { type: string, minLength: 1 }
        provider_type: { type: string, minLength: 1 }
        display_name: { type: string, minLength: 1 }
        credential_ref:
          type: [string, 'null']
          description: Secret reference only; plaintext credentials are forbidden.
        tier:
          type: string
          enum: [HOT, WARM, COLD, ARCHIVE]
        capabilities:
          type: object
          additionalProperties: true
    User:
      type: object
      required: [id, username, status, security_version, version, created_at]
      properties:
        id: { type: string, format: uuid }
        username: { type: string }
        email: { type: [string, 'null'], format: email }
        display_name: { type: [string, 'null'] }
        status:
          type: string
          enum: [ACTIVE, DISABLED, LOCKED, DELETED]
        security_version: { type: integer, format: int64 }
        version: { type: integer, format: int64 }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    UserPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/User' }
        next_cursor: { type: [string, 'null'] }
    CreateUserRequest:
      type: object
      required: [username]
      properties:
        username: { type: string, minLength: 1 }
        email: { type: [string, 'null'], format: email }
        display_name: { type: [string, 'null'] }
        initial_password:
          type: [string, 'null']
          writeOnly: true
          description: Accepted only over authenticated TLS; never persisted or logged in plaintext.
    Role:
      type: object
      required: [id, code, name, built_in, permissions]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        built_in: { type: boolean }
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    CreateRoleRequest:
      type: object
      required: [code, name]
      additionalProperties: false
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]*$', maxLength: 96 }
        name: { type: string, minLength: 1, maxLength: 128 }
        description: { type: [string, 'null'], maxLength: 2000 }
    ReplaceRolePermissionsRequest:
      type: object
      required: [permissions]
      additionalProperties: false
      properties:
        permissions:
          type: array
          uniqueItems: true
          items: { type: string }
    Permission:
      type: object
      required: [permission_key]
      properties:
        permission_key: { type: string }

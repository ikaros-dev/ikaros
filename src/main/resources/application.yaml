server:
  port: 10000

spring:
  application:
    name: ikaros
  r2dbc:
    url: ${IKAROS_R2DBC_URL:r2dbc:postgresql://localhost:5432/ikaros}
    username: ${IKAROS_DB_USERNAME:ikaros}
    password: ${IKAROS_DB_PASSWORD:openpostgresql}

r2dbc:
  migrate:
    resources-paths: classpath:/db/migration

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html

ikaros:
  storage:
    credential-encryption-key: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY:}
  security:
    jwt:
      issuer: ${IKAROS_JWT_ISSUER:ikaros}
      secret: ${IKAROS_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
      access-token-ttl: ${IKAROS_JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${IKAROS_JWT_REFRESH_TOKEN_TTL:P30D}

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 10000

spring:
  application:
    name: ikaros
  r2dbc:
    url: ${IKAROS_R2DBC_URL:}
    username: ${IKAROS_DB_USERNAME:}
    password: ${IKAROS_DB_PASSWORD:}

r2dbc:
  migrate:
    enable: true
    resources-paths: classpath*:/db/migration/*.sql
    wait-for-database: true
    prefer-db-specific-lock: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html

ikaros:
  storage:
    # Must be supplied by deployment secret management; never use a shared default.
    credential-encryption-key: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY:}
    credential-encryption-keys: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEYS:}
    credential-encryption-key-version: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY_VERSION:v1}
  security:
    verification:
      # Step-up Verification Grant 有效期；决定客户端可复用已验证状态的时间窗口。
      grant-ttl: ${IKAROS_SECURITY_VERIFICATION_GRANT_TTL:PT5M}
      # Email/SMS OTP 挑战策略；issue-window 与 max-issues-per-window 共同构成单用户发起频率限制。
      otp:
        ttl: ${IKAROS_SECURITY_VERIFICATION_OTP_TTL:PT5M}
        issue-window: ${IKAROS_SECURITY_VERIFICATION_OTP_ISSUE_WINDOW:PT10M}
        max-issues-per-window: ${IKAROS_SECURITY_VERIFICATION_OTP_MAX_ISSUES_PER_WINDOW:3}
        max-attempts: ${IKAROS_SECURITY_VERIFICATION_OTP_MAX_ATTEMPTS:5}
      email:
        delivery: ${IKAROS_SECURITY_EMAIL_DELIVERY:NOOP}
        endpoint: ${IKAROS_SECURITY_EMAIL_ENDPOINT:}
        from: ${IKAROS_SECURITY_EMAIL_FROM:}
        api-key: ${IKAROS_SECURITY_EMAIL_API_KEY:}
        log-code: ${IKAROS_SECURITY_EMAIL_LOG_CODE:false}
        reuse-window: ${IKAROS_SECURITY_EMAIL_REUSE_WINDOW:PT4H}
      sms:
        enabled: ${IKAROS_SECURITY_SMS_ENABLED:false}
        delivery: ${IKAROS_SECURITY_SMS_DELIVERY:NOOP}
        log-code: ${IKAROS_SECURITY_SMS_LOG_CODE:true}
    jwt:
      issuer: ${IKAROS_JWT_ISSUER:ikaros}
      secret: ${IKAROS_JWT_SECRET:}
      access-token-ttl: ${IKAROS_JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${IKAROS_JWT_REFRESH_TOKEN_TTL:P30D}

logging:
  charset:
    console: UTF-8
    file: UTF-8

server:
  port: 10000

spring:
  application:
    name: ikaros
  r2dbc:
    url: ${IKAROS_R2DBC_URL:}
    username: ${IKAROS_DB_USERNAME:}
    password: ${IKAROS_DB_PASSWORD:}

r2dbc:
  migrate:
    enable: true
    resources-paths: classpath*:/db/migration/*.sql
    wait-for-database: true
    prefer-db-specific-lock: true

springdoc:
  api-docs:
    path: /openapi.json
  swagger-ui:
    path: /swagger-ui.html

ikaros:
  storage:
    # Must be supplied by deployment secret management; never use a shared default.
    credential-encryption-key: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY:}
    credential-encryption-keys: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEYS:}
    credential-encryption-key-version: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY_VERSION:v1}
  security:
    verification:
      email:
        delivery: ${IKAROS_SECURITY_EMAIL_DELIVERY:NOOP}
        endpoint: ${IKAROS_SECURITY_EMAIL_ENDPOINT:}
        from: ${IKAROS_SECURITY_EMAIL_FROM:}
        api-key: ${IKAROS_SECURITY_EMAIL_API_KEY:}
    jwt:
      issuer: ${IKAROS_JWT_ISSUER:ikaros}
      secret: ${IKAROS_JWT_SECRET:}
      access-token-ttl: ${IKAROS_JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${IKAROS_JWT_REFRESH_TOKEN_TTL:P30D}

logging:
  charset:
    console: UTF-8
    file: UTF-8

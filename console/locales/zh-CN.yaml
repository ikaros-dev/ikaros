menuDescriptions:
  dashboard: 汇总需要关注的事项、正在执行的工作、资源与存储状态，作为进入各工作域的起点。
  resourceLibrary: 统一浏览、检索和管理 Ikaros 中的资源，并进入资源详情。
  resourceDetail: 查看单个资源的基础信息、文件、元数据、关系、状态与相关活动。
  resourceCollections: 管理资源集合以及资源与集合之间的组织关系。
  resourceSearch: 跨资源执行搜索，并通过筛选快速定位目标资源。
  addResource: 从本地、NAS、对象存储、远程地址或插件来源添加资源，并发起导入流程。
  activityCenter: 统一查看导入、存储、元数据、备份、下载、AI 与自动化等后台工作。
  activityDetail: 查看单个后台工作的状态、进度、结果、错误与执行信息。
  storageOverview: 查看存储容量、层级分布、Provider 状态、恢复状态与需要关注的问题。
  storageProviders: 配置和管理存储提供方、凭据、容量、层级与健康状态。
  storageProviderDetail: 查看和维护单个存储提供方的配置、容量和运行状态。
  storagePolicy: 配置资源在不同存储层级之间的生命周期、保留、副本与迁移策略。
  archiveManagement: 管理归档资源、恢复请求、恢复预算以及待清理对象。
  backupManagement: 管理备份与恢复点，并查看备份验证和发布状态。
  storageMaintenance: 处理完整性校验、Blob、Placement、GC、Delivery 与高级存储诊断。
  appsOverview: 查看已启用的核心应用和插件应用，并进入对应产品。
  drive: 浏览和管理个人文件、文件夹、空间以及云盘相关操作。
  driveNodeDetail: 查看单个文件或文件夹的版本、存储、共享、同步与活动信息。
  driveTransfers: 查看上传、下载和其他云盘传输任务的状态。
  driveSync: 管理设备与云盘之间的同步关系和同步状态。
  driveConflicts: 查看并处理同步过程中产生的文件冲突。
  driveTrash: 查看已删除的云盘对象，并执行恢复或永久删除。
  driveSettings: 管理云盘配额、策略、备份绑定和产品级设置。
  documents: 创建、组织和管理文档资源。
  documentEditor: 编辑单个文档的正文、版本和发布状态。
  media: 浏览和播放视频、音频等媒体资源，并管理媒体相关体验。
  planning: 管理项目、任务、计划与时间安排。
  finance: 管理账户、交易、预算、对账与个人财务数据。
  privateNotes: 管理需要更高隐私保护的私密笔记与同步状态。
  passwords: 管理密码条目、安全状态、设备访问与密码健康检查。
  ai: 提供 AI 对话、内容辅助、模型与智能能力入口。
  sharing: 管理资源分享、访问范围、链接和共享状态。
  analytics: 查看资源、存储、应用与使用情况的数据分析和报表。
  automation: 配置自动化规则、触发条件、动作与执行结果。
  pluginApps: 查看由插件提供的应用入口，并进入已启用的插件应用。
  pluginApp: 承载插件提供的独立应用页面；实际业务内容由对应插件实现。
  userManagement: 管理平台用户、账号状态、角色分配和会话治理。
  rolesPermissions: 统一管理角色、权限目录以及角色与权限之间的映射。
  authentication: 配置平台登录、Step-up、恢复与身份认证策略。
  pluginManagement: 管理插件安装、启停、升级、权限和生命周期。
  externalIntegrations: 管理 Connector、Metadata Source、Webhook 等平台外部连接。
  eventDelivery: 查看事件投递状态、失败重试和平台事件链路。
  notifications: 管理系统通知规则、渠道、模板与投递策略。
  auditLog: 查询平台审计事件，追踪用户、系统和高风险操作。
  systemParameters: 管理平台级系统参数及其生效范围。
  systemHealth: 查看应用、数据库、任务、事件和存储等核心组件健康状态。
  systemDiagnostics: 提供面向运维人员的低层诊断信息和故障排查入口。
  profile: 管理当前账号的头像、昵称、语言和基础资料。
  preferences: 管理当前账号的界面、语言、时区和使用偏好。
  accountNotifications: 管理当前账号接收哪些通知以及通知偏好。
  accountSecurity: 管理当前账号的密码、恢复方式和安全状态。
  sessions: 查看当前账号的登录会话，并管理需要退出或撤销的会话。
  apiTokens: 管理当前账号创建的 API 令牌及其访问范围和生命周期。

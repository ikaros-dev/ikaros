name: Ikaros feature request
description: Suggest an idea for this project
title: "[Feature] "
labels: [ "feature" ]
body:
  - type: markdown
    attributes:
      value: |

        Thank you for finding the time to propose new feature!

        We really appreciate the community efforts to improve Ikaros.

  - type: checkboxes
    attributes:
      label: Search before asking
      description: >
        Please make sure to search in the [issues](https://github.com/ikaros-dev/ikaros/issues?q=is%3Aissue) first to see
        whether the same feature was requested already.
      options:
        - label: >
            I had searched in the [issues](https://github.com/ikaros-dev/ikaros/issues?q=is%3Aissue) and found no similar
            feature requirement.
          required: true

  - type: textarea
    attributes:
      label: Description
      description: A short description of your feature

  - type: textarea
    attributes:
      label: Use case
      description: What do you want to happen?
      placeholder: >
        Rather than telling us how you might implement this feature, try to take a
        step back and describe what you are trying to achieve.

  - type: textarea
    attributes:
      label: Related issues
      description: Is there currently another issue associated with this?

  - type: textarea
    id: consoleGoldenPath
    attributes:
      label: Console Golden Path
      description: For Console work, link GP01-GP09 and describe the covered journey, user concept, success/failure/unauthorized/background-progress evidence, and any internal terms. Write N/A if this does not touch Console.
    validations:
      required: true

  - type: markdown
    attributes:
      value: "Thanks for completing our form!"

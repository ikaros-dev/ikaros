name: Build FastJar

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    if: github.repository == 'ikaros-dev/ikaros'
    name: Build and upload executable JAR
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build executable JAR
        run: mvn --batch-mode --update-snapshots -DskipTests package

      - name: Normalize release asset name
        run: cp target/ikaros-*.jar target/ikaros-server.jar

      - name: Upload executable JAR to release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: target/ikaros-server.jar
          asset_name: ikaros-server.jar
          tag: ${{ github.event.release.tag_name }}

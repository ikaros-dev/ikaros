server:
  port: 10000


spring:
  r2dbc:
    url: ${IKAROS_R2DBC_URL:r2dbc:postgresql://localhost:5432/ikaros}
    username: ${IKAROS_DB_USERNAME:postgres}
    password: ${IKAROS_DB_PASSWORD:123456}

ikaros:
  storage:
    credential-encryption-key: 8Zxhz3iZWHM+vDfiHL/Sv0E7oVsUKqoFxFTTi2BbR0c=
    credential-encryption-keys: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEYS:}
    credential-encryption-key-version: ${IKAROS_STORAGE_CREDENTIAL_ENCRYPTION_KEY_VERSION:v1}
  security:
    jwt:
      issuer: ${IKAROS_JWT_ISSUER:ikaros}
      secret: ${IKAROS_JWT_SECRET:change-this-development-secret-to-a-long-random-value}
      access-token-ttl: ${IKAROS_JWT_ACCESS_TOKEN_TTL:PT15M}
      refresh-token-ttl: ${IKAROS_JWT_REFRESH_TOKEN_TTL:P30D}

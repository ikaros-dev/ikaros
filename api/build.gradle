plugins {
    id 'java-library'
    id 'maven-publish'
    id 'checkstyle'
    id 'net.ltgt.errorprone'
    id "io.freefair.lombok" version "8.14.3"
}

apply from: rootProject.file('gradle/nullmarked-packages.gradle')


group = 'run.ikaros.api'
description = 'API of ikaros project, connecting by other projects.'

checkstyle {
    toolVersion = '9.3'
    showViolations = false
    ignoreFailures = false
    configFile = rootProject.file('config/checkstyle/checkstyle.xml')
}

def baselineApiVersion = '1.2.2'
def baselineApiJar = layout.projectDirectory.file("abi/ikaros-api-${baselineApiVersion}.jar")


repositories {
    mavenCentral()
}

configurations {
    japicmp
}

dependencies {
    japicmp 'com.github.siom79.japicmp:japicmp:0.23.1'
    errorprone 'com.google.errorprone:error_prone_core:2.36.0'
    errorprone 'com.uber.nullaway:nullaway:0.12.7'

    api platform(project(':platform:server'))
    compileOnlyApi 'org.jspecify:jspecify'

    api 'org.springframework.boot:spring-boot-starter-actuator'
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-mail'
    api 'org.springframework.boot:spring-boot-starter-thymeleaf'
    api 'org.springframework.boot:spring-boot-starter-webflux'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-data-r2dbc'
    api 'name.nkonev.r2dbc-migrate:r2dbc-migrate-spring-boot-starter'
    api 'com.github.f4b6a3:uuid-creator'

    // Spring Security
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.security:spring-security-oauth2-jose'
    api 'org.springframework.security:spring-security-oauth2-client'
    api 'org.springframework.security:spring-security-oauth2-resource-server'

    api "org.springdoc:springdoc-openapi-starter-webflux-ui"
    api 'org.openapi4j:openapi-schema-validator'
    api "net.bytebuddy:byte-buddy"

    api "org.apache.commons:commons-lang3"
    api "org.pf4j:pf4j"
    api "org.jsoup:jsoup"
    api "org.springframework.integration:spring-integration-core"
    api "org.thymeleaf.extras:thymeleaf-extras-springsecurity6"

    // Apache Lucene
    api "org.apache.lucene:lucene-core"
    api "org.apache.lucene:lucene-queryparser"
    api "org.apache.lucene:lucene-highlighter"
    api "org.apache.lucene:lucene-backward-codecs"
    api 'cn.shenyanchao.ik-analyzer:ik-analyzer'

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly 'org.postgresql:r2dbc-postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'io.projectreactor:reactor-test'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
//    withJavadocJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.errorprone {
        disableWarningsInGeneratedCode = true
        disableAllChecks = true
        check('NullAway', net.ltgt.gradle.errorprone.CheckSeverity.ERROR)
        option('NullAway:JSpecifyMode', 'true')
        option('NullAway:OnlyNullMarked', 'true')
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.register('checkApiAbi', JavaExec) {
    group = 'verification'
    description = "检查 API 与 ${baselineApiVersion} 版本的二进制兼容性"
    dependsOn tasks.named('jar')

    classpath = configurations.japicmp
    mainClass = 'japicmp.JApiCmp'
    inputs.file(baselineApiJar)
    inputs.file(tasks.named('jar').flatMap { it.archiveFile })
    outputs.file(layout.buildDirectory.file('reports/japicmp/report.html'))

    doFirst {
        def baselineFile = baselineApiJar.asFile
        if (!baselineFile.isFile()) {
            throw new GradleException("缺少 API ABI 基线文件: ${baselineFile}")
        }

        def currentJar = tasks.named('jar').get().archiveFile.get().asFile
        def reportFile = layout.buildDirectory.file('reports/japicmp/report.html').get().asFile
        reportFile.parentFile.mkdirs()
        args = [
                '--old', baselineFile.absolutePath,
                '--new', currentJar.absolutePath,
                '--only-modified',
                '--error-on-binary-incompatibility',
                '--ignore-missing-classes',
                '--exclude', 'run.ikaros.api.store.enums.AttachmentDriverType',
                '--html-file', reportFile.absolutePath
        ]
    }
}

tasks.named('check') {
    dependsOn tasks.named('checkApiAbi')
}

publishing {
    publications {
        library(MavenPublication) {
            from components.java
        }
    }
    repositories {
        mavenLocal()
    }
}
